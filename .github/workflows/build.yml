name: Build AstralRinth

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact_name: AstralRinth-linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: rpm
            artifact_name: AstralRinth-linux-rpm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi
            artifact_name: AstralRinth-windows
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            artifact_name: AstralRinth-macos
            # For Apple Silicon
            # - os: macos-latest
            #   target: aarch64-apple-darwin
            #   bundles: dmg
            #   artifact_name: AstralRinth-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsqlite3-dev \
            libx11-dev \
            libxrandr-dev \
            libxss-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libxcursor-dev \
            mesa-common-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-good1.0-dev \
            libgstreamer-plugins-ugly1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-good1.0-dev \
            gstreamer1.0-plugins-base-apps \
            libudev-dev \
            libgudev-1.0-dev \
            libxml2-dev \
            libxslt1-dev \
            libjpeg-dev \
            libpng-dev \
            libwebp-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-good1.0-dev \
            libgstreamer-plugins-ugly1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsqlite3-dev \
            libx11-dev \
            libxrandr-dev \
            libxss-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libglib2.0-dev \
            libgdk-pixbuf-2.0-dev \
            build-essential \
            pkg-config \
            cmake \
            libclang-dev \
            libudev-dev \
            libudev-dev \
            libsystemd-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsqlite3-dev \
            libx11-dev \
            libxrandr-dev \
            libxss-dev \
            libxkbcommon-dev \
            libxcursor-dev \
            libgdk-pixbuf-2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            pkg-config \
            cmake

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install \
            webkit2gtk \
            gtk+3 \
            libayatana-appindicator \
            librsvg \
            openssl \
            sqlite3 \
            pkg-config \
            cmake


      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run web:build

      - name: Generate SQLX query cache
        run: |
          cd packages/app-lib
          cargo sqlx prepare --workspace

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: v__VERSION__
          releaseName: 'AstralRinth v__VERSION__'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/app/target/release/bundle/
          retention-days: 30

  create-release:
    name: Create Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true